<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Job application automation pipeline</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{font-size:14px;font-weight:500;}
.s{font-size:12px;}
.arr{stroke:#73726c;stroke-width:1.5;fill:none;}
</style>
</defs>

<rect x="250" y="30" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Schedule trigger</text>
<line x1="340" y1="74" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<rect x="220" y="104" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="340" y="122" text-anchor="middle" dominant-baseline="central" fill="#085041">Scrape 8 role searches</text>
<text class="s" x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Apify, PM to Director</text>
<line x1="340" y1="160" x2="340" y2="190" class="arr" marker-end="url(#arrow)"/>

<rect x="220" y="190" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="340" y="208" text-anchor="middle" dominant-baseline="central" fill="#085041">Deduplicate and merge</text>
<text class="s" x="340" y="228" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">One clean list of roles</text>
<line x1="340" y1="246" x2="340" y2="276" class="arr" marker-end="url(#arrow)"/>

<rect x="220" y="276" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="340" y="294" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Score against CV</text>
<text class="s" x="340" y="314" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Fast model, match percent</text>
<line x1="340" y1="332" x2="340" y2="362" class="arr" marker-end="url(#arrow)"/>

<rect x="260" y="362" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="340" y="384" text-anchor="middle" dominant-baseline="central" fill="#633806">60% threshold</text>

<text class="s" x="150" y="428" text-anchor="middle" fill="#5F5E5A">below</text>
<path d="M260 384 L150 384 L150 452" class="arr" marker-end="url(#arrow)"/>
<text class="s" x="530" y="428" text-anchor="middle" fill="#5F5E5A">at or above</text>
<path d="M420 384 L530 384 L530 452" class="arr" marker-end="url(#arrow)"/>

<rect x="70" y="452" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="150" y="470" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Log to sheet</text>
<text class="s" x="150" y="490" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Skip, no duplicates</text>

<rect x="450" y="452" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="530" y="470" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Assess and write</text>
<text class="s" x="530" y="490" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Stronger model</text>
<line x1="530" y1="508" x2="530" y2="538" class="arr" marker-end="url(#arrow)"/>

<rect x="450" y="538" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="530" y="556" text-anchor="middle" dominant-baseline="central" fill="#085041">Cover letter and log</text>
<text class="s" x="530" y="576" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Google Docs and Sheets</text>
</svg>
